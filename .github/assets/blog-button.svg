<svg xmlns="http://www.w3.org/2000/svg" width="300" height="56" viewBox="0 0 300 56" role="img" aria-label="Check out the blog">
  <rect x="1.5" y="1.5" width="297" height="53" rx="10"
        fill="#050807" stroke="#00ff9c" stroke-width="2"/>
  <rect x="6" y="6" width="288" height="44" rx="7"
        fill="none" stroke="#00ff9c" stroke-width="1" opacity="0.25"/>
  <text x="150" y="35" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="18" font-weight="700" letter-spacing="1.5"
        fill="#00ff9c">&gt; check out the blog</text>
  <rect x="256" y="22" width="10" height="16" fill="#00ff9c">
